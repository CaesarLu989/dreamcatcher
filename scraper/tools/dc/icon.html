<!doctype html>
<html><head><meta charset="utf-8">
<title>DreamCatcher app icon</title>
<style>
  /* 1024×1024 macOS app icon: Apple's Big Sur grid = 824×824 squircle centred on a 1024 canvas (transparent margin). */
  html, body { margin: 0; background: transparent; width: 1024px; height: 1024px; overflow: hidden; }
  .icon { position: absolute; left: 100px; top: 100px; width: 824px; height: 824px; }
  .icon svg.bg { position: absolute; inset: 0; width: 824px; height: 824px; }
  .logo { position: absolute; left: 0; top: -40px; width: 824px; height: 824px; display: flex; align-items: center; justify-content: center; }
  .logo .dc-logo { width: 560px; height: auto; filter: drop-shadow(0 0 40px rgba(0,47,167,.65)); }
  /* the logo's CSS (copied from theme.css, dark colours) — animations disabled for a canonical still frame */
  .dc-logo { overflow: visible; --dc-string: #8FAEFF; --dc-bead: #C7D6FF; --dc-eye: #E4ECFF; }
  .dc-logo .dc-hoop { fill: none; stroke-width: 2.4; stroke-linecap: round; }
  .dc-logo .dc-hoop-in { fill: none; stroke: #8FAEFF; stroke-width: .45; opacity: .5; }
  .dc-logo .dc-web { fill: none; stroke: inherit; stroke-width: .75; opacity: .9; stroke-linecap: round; }
  .dc-logo .dc-eye { fill: var(--dc-eye); }
  .dc-logo .dc-sweep { opacity: .7; }
  .dc-logo .dc-sweepwrap { transform-origin: 100px 96px; transform: rotate(300deg); }
  .dc-logo .dc-moon-edge { fill: none; stroke: #C7D6FF; stroke-width: .6; opacity: .65; }
  .dc-logo .dc-string { fill: none; stroke: var(--dc-string); stroke-width: .7; opacity: .8; }
  .dc-logo .dc-bead { fill: var(--dc-bead); }
  .dc-logo * { animation: none !important; }
</style></head>
<body>
<div class="icon">
  <svg class="bg" viewBox="0 0 824 824" aria-hidden="true">
    <defs>
      <!-- macOS continuous-corner squircle (superellipse approximation) -->
      <clipPath id="sq"><rect id="sqp" x="0" y="0" width="824" height="824" rx="186" ry="186"/></clipPath>
      <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0B0F1C"/><stop offset=".5" stop-color="#050607"/><stop offset="1" stop-color="#020306"/>
      </linearGradient>
      <radialGradient id="glow" cx=".62" cy=".58" r=".55">
        <stop offset="0" stop-color="#002FA7" stop-opacity=".75"/><stop offset=".5" stop-color="#002FA7" stop-opacity=".22"/><stop offset="1" stop-color="#002FA7" stop-opacity="0"/>
      </radialGradient>
      <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#FFFFFF" stroke-opacity=".045" stroke-width="1.5"/></pattern>
      <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient>
    </defs>
    <g clip-path="url(#sq)">
      <rect width="824" height="824" fill="url(#night)"/>
      <rect width="824" height="824" fill="url(#grid)"/>
      <rect width="824" height="824" fill="url(#glow)"/>
      <rect width="824" height="824" fill="url(#rim)"/>
    </g>
    <use href="#sqp" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="3"/>
  </svg>
  <div class="logo" id="logo"></div>
</div>
<script src="logo.js"></script>
<script>document.getElementById("logo").innerHTML = dcLogo(560, "ic", { animate: false });</script>
</body></html>
