:root{--font:"Outfit","Noto Sans CJK SC","PingFang SC",sans-serif;--mono:"DM Mono","Noto Sans CJK SC",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--base)}
body{width:1440px;color:var(--ink);font:400 16px/24px var(--font);background:var(--page);background-repeat:no-repeat;background-color:var(--base);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
.wrap{width:1280px;margin:0 auto;position:relative}
.metal{background:var(--metal-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.label{font:500 13px/18px var(--font);color:var(--muted)}
.mono{font-family:var(--mono)}
.nav{height:72px;border-bottom:1px solid var(--line);position:relative;z-index:5;background:var(--nav)}
.nav .wrap{height:72px;display:flex;align-items:center}
.brand{display:flex;align-items:center;gap:12px;font:500 20px/24px "Outfit",var(--font);letter-spacing:-.02em;margin-right:52px;color:var(--ink)}
.nav-words{display:flex;gap:34px;font:500 15px/72px var(--font);color:var(--ink-2)}
.nav-words span{position:relative;display:block;height:72px}
.nav-words .on{color:var(--ink)}
.nav-words .on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--nav-on)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.cmdk{width:268px;height:40px;border:1px solid var(--line-2);border-radius:var(--r-sm);display:flex;align-items:center;padding:0 12px;gap:10px;color:var(--muted);font:400 14px/20px var(--font);background:var(--field)}
.cmdk kbd{margin-left:auto;font:500 13px/18px var(--mono);color:var(--ink-2);border:1px solid var(--line-2);border-radius:3px;padding:0 6px}
.scan{display:flex;align-items:center;gap:8px;font:400 14px/20px var(--font);color:var(--ink-2);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;font:500 13px/30px var(--font);background:var(--field)}
.seg span{padding:0 10px;color:var(--muted);display:flex;align-items:center;gap:6px;height:30px}
.seg .on{background:var(--seg-on);color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 22px;border-radius:var(--r-sm);font:500 16px/24px var(--font);white-space:nowrap}
.btn--primary{background:var(--btn);color:var(--btn-ink);box-shadow:var(--btn-shadow)}
.btn--secondary{border:1px solid var(--line-3);color:var(--ink)}
.btn--sm{height:36px;padding:0 14px;font-size:14px}
.link{color:var(--ink);background:linear-gradient(var(--accent),var(--accent)) 0 100%/100% 1px no-repeat;padding-bottom:2px}
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border:1px solid var(--line-2);border-radius:var(--r-sm);font:500 13px/18px var(--font);color:var(--ink-2);white-space:nowrap}
.chip.on{background:var(--seg-on);color:var(--ink);border-color:var(--line-3)}
.chip.new{border-color:var(--accent-line);color:var(--accent-ink);background:var(--accent-soft)}
.chip.soon{border-color:var(--ember-line);color:var(--ember)}
.chip.stale{border-style:dashed;color:var(--muted)}
kbd.k{font:500 13px/18px var(--mono);color:var(--ink-2);border:1px solid var(--line-2);border-radius:3px;padding:0 5px;background:var(--field)}
.foot{border-top:1px solid var(--line);margin-top:64px;padding:22px 0 36px;display:flex;justify-content:space-between;color:var(--muted);font:400 14px/20px var(--font)}
.hero{display:grid;grid-template-columns:420px 860px;padding:52px 0 0;align-items:start}
.date{font:400 15px/22px var(--font);color:var(--ink-2)}
.h1{font:300 62px/70px var(--font);letter-spacing:-.03em;margin-top:22px;white-space:nowrap}
.h1 b{font-weight:300;font-family:"Outfit";letter-spacing:-.04em}
.lead{font:400 16px/27px var(--font);color:var(--ink-2);margin-top:22px;max-width:400px}
.trio{display:flex;gap:30px;margin-top:28px;padding-top:24px;border-top:1px solid var(--line)}
.trio div{display:flex;align-items:baseline;gap:8px;font:400 15px/22px var(--font);color:var(--ink-2)}
.trio b{font:300 32px/36px "Outfit";letter-spacing:-.03em}
.split{display:flex;gap:3px;height:6px;margin-top:14px;max-width:400px}
.split i{display:block;border-radius:3px}
.acts{display:flex;gap:12px;margin-top:26px}
.ask{font:400 15px/22px var(--font);color:var(--ink-2);margin-top:20px}
.next{margin-top:30px;padding-top:20px;border-top:1px solid var(--line);max-width:400px}
.next .label{display:block;margin-bottom:10px}
.next p{display:grid;grid-template-columns:62px 1fr;gap:8px;font:400 15px/26px var(--font);color:var(--ink-2)}
.next p b{font:500 14px/26px var(--mono);color:var(--ink)}
.next p.soon b{color:var(--ember)}
.sec{display:flex;align-items:center;gap:14px;margin:44px 0 14px}
.sec h2{font:400 32px/40px var(--font);letter-spacing:-.02em;margin-right:8px}
.sec .hint{margin-left:auto;display:flex;gap:14px;align-items:center;font:400 13px/20px var(--font);color:var(--muted)}
.sec .hint span{display:flex;gap:6px;align-items:center}
.tbl{border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--card-shadow);overflow:hidden}
.row{display:grid;grid-template-columns:30px 112px minmax(0,1fr) 300px 128px 36px;gap:20px;align-items:center;padding:13px 20px 13px 18px;border-top:1px solid var(--line);position:relative}
.row:first-child{border-top:0}
.row.sel{background:var(--accent-soft)}
.row.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--metal-text)}
.rk{font:400 13px/18px var(--mono);color:var(--muted)}
.ht{display:flex;align-items:center;gap:11px}
.ht b{font:300 26px/28px "Outfit";letter-spacing:-.03em;display:block}
.ht em{font:500 13px/16px var(--font);font-style:normal;color:var(--accent-ink);display:block}
.ti{min-width:0}
.ti b{display:block;font:500 16px/22px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ti .m{display:flex;gap:8px;align-items:center;margin-top:2px;font:400 13px/20px var(--font);color:var(--ink-2)}
.ti p{font:400 13px/20px var(--font);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{display:grid;grid-template-columns:62px 1fr 62px;gap:5px 10px;align-items:center;font:400 13px/18px var(--font);color:var(--muted)}
.mt b{font:500 14px/18px var(--mono);color:var(--ink);text-align:right;white-space:nowrap}
.mt .cap{grid-column:2/4;color:var(--accent-ink);font:400 13px/18px var(--font)}
.bar{height:4px;background:var(--track);border-radius:2px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:2px}
.rng{height:6px;background:var(--track);border-radius:3px;position:relative}
.rng i{position:absolute;top:0;bottom:0;background:var(--bar);border-radius:3px}
.wh{font:500 14px/20px var(--font)}
.wh em{display:block;font:400 13px/18px var(--font);font-style:normal;color:var(--muted)}
.wh.new{color:var(--accent-ink)} .wh.soon{color:var(--ember)}
.go{width:36px;height:36px;border:1px solid var(--line-2);border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-2)}
.more{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:16px 20px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--card-shadow);font:400 16px/24px var(--font);color:var(--ink-2)}
.more b{color:var(--ink);font-weight:500}
.cards{display:grid;grid-template-columns:848px 412px;gap:20px;margin-top:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--card-shadow);padding:26px 28px 28px}
.card h3{font:400 22px/30px var(--font);letter-spacing:-.01em;display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px}
.card h3 span{font:400 13px/18px var(--font);color:var(--muted)}
.pipe{display:flex;gap:26px;align-items:center}
.pipe ul{list-style:none;flex:1;display:grid;gap:10px}
.pipe li{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;font:400 15px/22px var(--font);color:var(--ink-2)}
.pipe li i{width:10px;height:10px;border-radius:2px;display:block}
.pipe li b{font:500 15px/22px var(--mono);color:var(--ink)}
.pipe-note{font:400 13px/20px var(--font);color:var(--muted);margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.blk{display:grid;grid-template-columns:repeat(4,1fr);margin-top:20px}
.blk-h{grid-column:1/5}
.blk > div{padding:0 22px 2px;border-left:1px solid var(--line)}
.blk > div:nth-of-type(1){padding-left:0;border-left:0}
.blk b{display:block;font:500 15px/22px var(--font)}
.blk p{display:flex;gap:7px;align-items:flex-start;font:400 13px/20px var(--font);color:var(--muted);margin-top:6px}
.blk p svg{flex:none;margin-top:2px}
.gold{background:var(--gold-text);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero{grid-template-columns:420px 860px}
.dialbox{position:relative;width:860px;height:812px}
.dialbox > *{position:absolute}
.date{display:flex;align-items:center;gap:10px}
.date .sep{display:block;width:1px;height:14px;background:var(--line-3)}
.mn{display:block;flex:none;font-style:normal}
.next p{grid-template-columns:62px 18px 1fr;align-items:center}
.sec{margin-top:26px}
.tbl,.card,.more{background:var(--brush), var(--surface);position:relative}
.tbl::after,.card::after,.more::after{content:"";position:absolute;left:22px;right:22px;top:0;height:1px;background:var(--chamfer);pointer-events:none}
.row.sel{background:linear-gradient(100deg, var(--accent-soft) 0%, var(--accent-soft) 52%, var(--streak) 62%, var(--accent-soft) 72%)}
.row.sel::before{background:var(--gold-text)}

/* app.css — what the live page adds to the prototype's base styles (base.css): fluid widths, real controls, motion,
   the role dossier, the command palette, the Roles / Pipeline / Engine screens. Theme colours come from theme.js as custom properties. */
:root{--font:"Outfit","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",sans-serif;--mono:"DM Mono","PingFang SC","Noto Sans CJK SC",ui-monospace,monospace;--gut:32px;--ease:cubic-bezier(.2,.7,.2,1)}
html{scroll-behavior:smooth;scroll-padding-top:88px;-webkit-text-size-adjust:100%}
body{width:auto;min-height:100vh;background-size:100% auto;overflow-x:hidden}
#main{overflow-x:clip}
.wrap{width:min(1280px, 100% - 2 * var(--gut))}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
::selection{background:var(--accent-soft)}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:16px;top:-60px;z-index:90;background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:var(--r-sm);font:500 15px/20px var(--font);transition:top .2s}
.skip:focus{top:12px}

/* ---- navigation ---- */
.nav{position:sticky;top:0;z-index:40;-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
.brand{margin-right:44px;white-space:nowrap}
.brand svg{transition:transform .5s var(--ease)}
.brand:hover svg{transform:rotate(-8deg) scale(1.06)}
.nav-words a{position:relative;display:block;height:72px;transition:color .2s}
.nav-words a:hover{color:var(--ink)}
.nav-words a::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--nav-on);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
.nav-words a.on{color:var(--ink)}
.nav-words a.on::after,.nav-words a:hover::after{transform:scaleX(1)}
.cmdk{cursor:pointer;transition:border-color .2s, background .2s;min-width:0}
.cmdk:hover{border-color:var(--line-3)}
.cmdk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scan.late .dot{background:var(--ember);box-shadow:0 0 0 3px var(--ember-line)}
.dot{animation:beat 2.8s ease-in-out infinite}
.seg button{padding:0 10px;color:var(--muted);display:flex;align-items:center;gap:6px;height:30px;font:500 13px/30px var(--font);transition:color .2s, background .2s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--seg-on);color:var(--ink)}
.tabbar{display:none}

/* ---- buttons, chips ---- */
.btn{cursor:pointer;transition:transform .16s var(--ease), box-shadow .2s, background .2s, border-color .2s;-webkit-user-select:none;user-select:none}
.btn svg{transition:transform .2s var(--ease)}
.btn:hover{transform:translateY(-1px)}
.btn:hover svg{transform:translateX(3px)}
.btn:active{transform:translateY(1px) scale(.985)}
.btn--secondary:hover{border-color:var(--ink-2);background:var(--field)}
.btn--ghost{height:36px;padding:0 12px;font-size:14px;color:var(--ink-2)}
.btn--ghost:hover{color:var(--ink);background:var(--field)}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{transition:background .2s, color .2s, border-color .2s}
button.chip{cursor:pointer;height:30px;padding:0 12px}
button.chip:hover{border-color:var(--line-3);color:var(--ink)}
.chip.old{border-style:dashed;color:var(--muted)}
.link{cursor:pointer;transition:background-size .3s var(--ease);background-size:100% 1px}
.link:hover{background-size:100% 2px}

/* ---- Today: the hero ---- */
.hero{grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:0;padding-top:44px}
.h1{font-size:clamp(38px, 4.3vw, 62px);line-height:1.13;white-space:nowrap}
.h1 b{font-variant-numeric:tabular-nums}
.lead{max-width:none}
.trio button{display:flex;align-items:baseline;gap:8px;font:400 15px/22px var(--font);color:var(--ink-2);cursor:pointer;transition:color .2s}
.trio button:hover{color:var(--ink)}
.trio button b{font:300 32px/36px "Outfit";letter-spacing:-.03em}
.split i{transition:flex .6s var(--ease)}
.acts{flex-wrap:wrap}
.next p{grid-template-columns:62px 18px 1fr}
.next p span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dialwrap{position:relative;width:100%;height:calc(812px * var(--k, 1));justify-self:end}
.dialbox{position:absolute;left:calc(var(--ox, 0) * -1px * var(--k, 1));top:0;transform:scale(var(--k, 1));transform-origin:0 0;--sw:0deg}
.dialbox .rot{transform-origin:430px 330px;transform:rotate(var(--sw))}
.dialbox .unrot{transform:rotate(calc(-1 * var(--sw)))}
.dialbox .m,.dialbox .th,.dialbox .sn{cursor:pointer}
.dialbox .m,.dialbox .lb{animation:mIn .6s var(--ease) both;animation-delay:calc(var(--t, 0) * 1s)}
.dialbox .m,.dialbox .mi,.dialbox .lb,.dialbox .pg,.dialbox .th,.dialbox .sn{transform-box:fill-box;transform-origin:center}
.dialbox .mi{transition:transform .2s var(--ease)}
.dialbox .m:hover .mi,.dialbox .m.hot .mi{transform:scale(1.22)}
.dialbox .m.dim{opacity:.22 !important;transition:opacity .25s}
.dialbox .pg{animation:ping 2.8s ease-out infinite}
.dialbox .em{animation:ember 2.2s ease-in-out infinite}
.dialbox .glow{animation:breathe 6.5s ease-in-out infinite}
.dialbox .rays{animation:breathe 6.5s ease-in-out -2s infinite}
.dialbox .veil{animation:drift 18s ease-in-out infinite alternate}
.dialbox .veil.v2{animation-duration:23s;animation-direction:alternate-reverse}
.dialbox .th text,.dialbox .sn text{transition:opacity .2s}
.dialbox .th:hover text:last-of-type,.dialbox .sn:hover text:first-of-type{text-decoration:underline}
.dialbox.still .m,.dialbox.still .lb{animation:none}
.tip{position:absolute;z-index:6;pointer-events:none;min-width:220px;max-width:300px;padding:12px 14px;border-radius:var(--r-md);background:var(--plate);border:1px solid var(--line-2);box-shadow:0 18px 44px rgba(0,0,0,.34);opacity:0;transform:translateY(6px);transition:opacity .16s, transform .16s var(--ease)}
.tip.on{opacity:1;transform:none}
.tip b{display:block;font:500 15px/20px var(--font)}
.tip span{display:block;font:400 13px/18px var(--font);color:var(--ink-2);margin-top:2px}
.tip i{display:flex;gap:12px;font:500 13px/18px var(--mono);font-style:normal;color:var(--accent-ink);margin-top:8px}
@keyframes mIn{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
@keyframes ping{0%{transform:scale(.72);opacity:.5}70%,100%{transform:scale(1.5);opacity:0}}
@keyframes ember{50%{opacity:.45}}
@keyframes breathe{50%{opacity:.72}}
@keyframes drift{to{transform:translateX(46px)}}
@keyframes sheen{to{transform:rotate(360deg)}}
@keyframes beat{50%{box-shadow:0 0 0 6px transparent}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rise > *{animation:up .55s var(--ease) both}
.rise > *:nth-child(2){animation-delay:.05s}.rise > *:nth-child(3){animation-delay:.1s}.rise > *:nth-child(4){animation-delay:.15s}.rise > *:nth-child(5){animation-delay:.2s}.rise > *:nth-child(6){animation-delay:.25s}.rise > *:nth-child(7){animation-delay:.3s}.rise > *:nth-child(n+8){animation-delay:.35s}

/* ---- lists ---- */
.sec{flex-wrap:wrap;row-gap:10px}
.sec h2{font-size:clamp(24px, 2.4vw, 32px);line-height:1.25}
.row{cursor:pointer;transition:background .18s;grid-template-columns:30px 112px minmax(0,1fr) minmax(220px,300px) 128px auto;outline-offset:-2px}
.row:hover{background:var(--field)}
.row.sel{background:linear-gradient(100deg, var(--accent-soft) 0%, var(--accent-soft) 52%, var(--streak) 62%, var(--accent-soft) 72%)}
.row .ti b{transition:color .2s}
.row:hover .ti b{color:var(--accent-ink)}
.row.done{opacity:.55}
.ti .m{flex-wrap:wrap;row-gap:4px}
.ti .m span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acts-r{display:flex;gap:6px;align-items:center}
.ib{width:36px;height:36px;border:1px solid var(--line-2);border-radius:var(--r-sm);display:grid;place-items:center;color:var(--ink-2);cursor:pointer;transition:transform .16s var(--ease), color .2s, border-color .2s, background .2s;flex:none}
.ib:hover{color:var(--ink);border-color:var(--line-3);background:var(--field);transform:translateY(-1px)}
.ib:active{transform:scale(.94)}
.ib.go:hover svg{transform:translateX(2px)}
.ib svg{transition:transform .2s var(--ease)}
.ib.yes:hover{color:var(--accent-ink);border-color:var(--accent-line)}
.ib.no:hover{color:var(--ember);border-color:var(--ember-line)}
.row .ib.yes,.row .ib.no{opacity:0;transition:opacity .16s, transform .16s var(--ease), color .2s, border-color .2s}
.row:hover .ib,.row.sel .ib,.row:focus-within .ib{opacity:1}
.empty{padding:44px 24px;text-align:center;color:var(--muted);font:400 15px/24px var(--font)}
.empty b{display:block;font:400 22px/30px var(--font);color:var(--ink);margin-bottom:6px}
.more{gap:16px;flex-wrap:wrap}
.cards{grid-template-columns:minmax(0,2.06fr) minmax(0,1fr)}
.card svg.fn{width:100%;height:auto}
.card h3{gap:16px}
.card h3 span{text-align:right}
.blk{grid-template-columns:repeat(4,minmax(0,1fr));row-gap:18px}
.blk b{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.blk > div{cursor:pointer}
.blk > div:hover b{color:var(--accent-ink)}
.foot{gap:16px;flex-wrap:wrap}
.foot a{background:linear-gradient(var(--line-3),var(--line-3)) 0 100%/100% 1px no-repeat}

/* ---- Roles ---- */
.head{padding:44px 0 6px;display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap}
.head h1{font:300 clamp(34px, 3.6vw, 52px)/1.15 var(--font);letter-spacing:-.03em}
.head p{font:400 16px/26px var(--font);color:var(--ink-2);max-width:760px;margin-top:10px}
.head .sp{margin-left:auto}
.tools{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin:24px 0 18px;position:sticky;top:84px;z-index:20;padding:10px 12px 10px 16px;background:var(--nav);-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--card-shadow)}
.tools .grow{flex:1}
.tools .seg{flex:none}
.tools .lbl{font:500 13px/18px var(--font);color:var(--muted)}
.find{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--field);color:var(--muted);min-width:200px}
.find input{border:0;background:none;outline:0;flex:1;min-width:0;color:var(--ink);font:400 14px/20px var(--font)}
.find:focus-within{border-color:var(--accent-line)}
.grp{display:flex;align-items:baseline;gap:12px;margin:30px 0 12px}
.grp:first-child{margin-top:8px}
.grp h3{font:400 22px/30px var(--font);letter-spacing:-.01em}
.grp span{font:400 13px/20px var(--mono);color:var(--muted)}
.grp i{flex:1;height:1px;background:var(--line);align-self:center}

/* ---- the role dossier ---- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(6,9,16,.52);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .2s both}
.drawer{position:fixed;right:0;top:0;bottom:0;z-index:61;width:min(560px, 100%);background:var(--base);background-image:var(--plate);border-left:1px solid var(--line-2);box-shadow:-30px 0 80px rgba(0,0,0,.35);display:flex;flex-direction:column;animation:slide .34s var(--ease) both}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.drawer::before{content:"";position:absolute;left:0;top:28px;bottom:28px;width:1px;background:var(--chamfer);background-size:100% 100%;transform:scaleX(1);opacity:.7;background:linear-gradient(180deg, rgba(240,207,124,0), rgba(240,207,124,.7) 30%, rgba(240,207,124,.7) 70%, rgba(240,207,124,0))}
.dw-top{display:flex;align-items:center;gap:10px;padding:16px 22px;border-bottom:1px solid var(--line)}
.dw-top .sp{margin-left:auto}
.dw-body{overflow:auto;padding:22px 26px 28px;flex:1;overscroll-behavior:contain}
.dw-body h2{font:400 26px/34px var(--font);letter-spacing:-.02em;margin-top:10px}
.dw-co{font:400 15px/22px var(--font);color:var(--ink-2);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dw-hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-top:22px;padding:18px 20px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--brush), var(--surface);position:relative}
.dw-hero::after{content:"";position:absolute;left:22px;right:22px;top:0;height:1px;background:var(--chamfer)}
.dw-hero .big{font:300 54px/56px "Outfit";letter-spacing:-.04em}
.dw-hero em{font:500 14px/20px var(--font);font-style:normal;color:var(--accent-ink);display:block}
.dw-hero p{font:400 14px/22px var(--font);color:var(--ink-2)}
.dw-sec{margin-top:26px}
.dw-sec h4{font:500 13px/18px var(--font);color:var(--muted);margin-bottom:12px;display:flex;justify-content:space-between;gap:12px}
.dw-sec h4 span{font-weight:400}
.kv{display:grid;grid-template-columns:96px 1fr auto;gap:8px 12px;align-items:center;font:400 14px/20px var(--font);color:var(--ink-2)}
.kv b{font:500 14px/20px var(--mono);color:var(--ink);text-align:right;white-space:nowrap}
.why li{list-style:none;display:grid;grid-template-columns:18px 1fr;gap:8px;font:400 15px/24px var(--font);color:var(--ink-2);padding:3px 0}
.why li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);margin:9px 0 0 4px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.gates li{list-style:none;display:grid;grid-template-columns:22px 132px 1fr;gap:8px;align-items:start;padding:8px 0;border-top:1px solid var(--line);font:400 14px/22px var(--font)}
.gates li:first-child{border-top:0}
.gates li b{font-weight:500}
.gates li span{color:var(--ink-2)}
.gates .st{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;margin-top:2px;background:var(--accent-soft);color:var(--accent-ink)}
.gates .ask .st{background:transparent;border:1px dashed var(--ember-line);color:var(--ember)}
.gates .stop .st{background:transparent;border:1px solid var(--ember);color:var(--ember)}
.gates .ask span,.gates .stop span{color:var(--ember)}
.sig{display:grid;grid-template-columns:72px 1fr 44px 44px;gap:8px 12px;align-items:center;font:400 13px/18px var(--font);color:var(--ink-2)}
.sig b{font:500 13px/18px var(--mono);color:var(--ink);text-align:right}
.sig i{font:400 13px/18px var(--mono);font-style:normal;color:var(--muted);text-align:right}
.sig .hd{color:var(--muted);font-size:13px}
.dw-foot{display:flex;gap:10px;padding:16px 22px;border-top:1px solid var(--line);flex-wrap:wrap}
.dw-foot .btn{flex:1;justify-content:center;min-width:140px}
.note{font:400 13px/20px var(--font);color:var(--muted);margin-top:10px}

/* ---- command palette, toast ---- */
.pal{position:fixed;left:50%;top:14vh;z-index:71;width:min(640px, 100% - 32px);transform:translateX(-50%);border:1px solid var(--line-2);border-radius:var(--r-lg);background:var(--base);background-image:var(--plate);box-shadow:0 40px 100px rgba(0,0,0,.5);overflow:hidden;animation:pal .22s var(--ease) both}
@keyframes pal{from{opacity:0;transform:translate(-50%,-10px)}to{opacity:1;transform:translate(-50%,0)}}
.pal .q{display:flex;align-items:center;gap:12px;padding:0 18px;height:58px;border-bottom:1px solid var(--line);color:var(--muted)}
.pal .q input{flex:1;border:0;outline:0;background:none;font:400 18px/26px var(--font);color:var(--ink)}
.pal ul{list-style:none;max-height:52vh;overflow:auto;padding:8px}
.pal li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-radius:var(--r-sm);cursor:pointer;font:400 15px/22px var(--font)}
.pal li.on{background:var(--accent-soft)}
.pal li b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pal li span{display:block;font:400 13px/18px var(--font);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal li em{font:500 13px/18px var(--mono);font-style:normal;color:var(--muted)}
.pal .cap{padding:8px 14px 2px;font:500 13px/18px var(--font);color:var(--muted)}
.pal .lock{color:var(--ember)}
.toast{position:fixed;left:50%;bottom:28px;z-index:80;transform:translateX(-50%);display:flex;gap:14px;align-items:center;padding:12px 16px 12px 18px;border-radius:var(--r-md);background:var(--btn);color:var(--btn-ink);box-shadow:0 18px 44px rgba(0,0,0,.4);font:500 15px/22px var(--font);animation:up .3s var(--ease) both;max-width:calc(100% - 32px)}
.toast button{font:500 14px/20px var(--font);text-decoration:underline;text-underline-offset:3px}

/* ---- Pipeline ---- */
.pcols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;margin-top:20px;align-items:start}
.pcol{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--brush), var(--surface);padding:16px 14px 14px;position:relative;min-height:160px}
.pcol::after{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:var(--chamfer)}
.pcol h3{display:flex;align-items:center;gap:8px;font:500 15px/22px var(--font);margin-bottom:12px}
.pcol h3 i{width:10px;height:10px;border-radius:2px;display:block}
.pcol h3 b{margin-left:auto;font:500 15px/22px var(--mono)}
.pc{border:1px solid var(--line);border-radius:var(--r-md);padding:12px;margin-top:10px;background:var(--field);transition:transform .18s var(--ease), border-color .2s}
.pc:hover{transform:translateY(-2px);border-color:var(--line-3)}
.pc b{display:block;font:500 14px/20px var(--font);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pc span{display:block;font:400 13px/18px var(--font);color:var(--ink-2);margin-top:2px}
.pc .mv{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.pc .mv button{height:26px;padding:0 8px;border:1px solid var(--line-2);border-radius:var(--r-sm);font:500 13px/24px var(--font);color:var(--ink-2);transition:color .2s, border-color .2s, background .2s}
.pc .mv button:hover{color:var(--ink);border-color:var(--line-3);background:var(--seg-on)}
.pc .mv button.x:hover{color:var(--ember);border-color:var(--ember-line)}
.pnone{font:400 13px/20px var(--font);color:var(--muted);padding:6px 2px}
.form{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.form input,.form select{height:40px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--field);font:400 14px/20px var(--font);min-width:0}
.form input[type=text]{flex:1;min-width:180px}
.form select option{color:#0C0F14;background:#fff}

/* ---- Engine ---- */
.eng{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:20px}
.eng .wide{grid-column:1/-1}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-bottom:26px;counter-reset:st}
.steps div{padding:0 18px 0 0;position:relative;counter-increment:st}
.steps div::before{content:counter(st, decimal-leading-zero);display:block;font:500 13px/18px var(--mono);color:var(--accent-ink);margin-bottom:6px}
.steps b{display:block;font:500 15px/22px var(--font)}
.steps p{font:400 13px/20px var(--font);color:var(--muted);margin-top:4px}
.formula{font:400 15px/26px var(--font);color:var(--ink-2)}
.formula b{font:500 15px/26px var(--mono);color:var(--ink)}
.heat{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px}
.heat div{display:flex;gap:8px;align-items:center;font:400 13px/18px var(--font);color:var(--ink-2)}
.heat b{font:500 13px/18px var(--mono);color:var(--ink)}
.arch{width:100%;border-collapse:collapse;font:400 14px/20px var(--font)}
.arch th{font:500 13px/18px var(--font);color:var(--muted);text-align:left;padding:0 10px 10px 0;white-space:nowrap}
.arch td{padding:9px 10px 9px 0;border-top:1px solid var(--line);vertical-align:middle}
.arch td:first-child{font-weight:500;white-space:nowrap}
.arch .w{display:flex;align-items:center;gap:6px;font:400 13px/18px var(--mono);color:var(--ink-2)}
.arch .w i{display:block;height:4px;border-radius:2px;background:var(--bar);min-width:2px}
.tscroll{overflow-x:auto}
.set{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set b{display:block;font:500 15px/22px var(--font)}
.set span{font:400 13px/20px var(--font);color:var(--muted)}
.blist{margin-top:14px}
.blist li{list-style:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 36px;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font:400 14px/20px var(--font)}
.blist li:first-child{border-top:0}
.blist b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blist span{color:var(--ink-2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blist p{display:flex;gap:7px;color:var(--muted);align-items:flex-start}
.blist p svg{flex:none;margin-top:2px}
.src{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 22px}

<body>
<div id="nav"></div>
<main id="main" tabindex="-1"></main>
<div id="drawer"></div>
<div id="pal"></div>
<noscript><p style="padding:48px;font:16px/1.6 sans-serif">DreamCatcher needs JavaScript to draw the radar. 需要打开 JavaScript 才能显示雷达。</p></noscript>
<script id="dc-data" type="application/json"></script>
<script>
(function () {
"use strict";
/* ===== core.js ===== */
// core.js — drawing helpers shared by the page and the icon: the wolf outline, the DreamCatcher mark, the white desktop
// icon, real moon phases (Meeus), the moon-phase glyph, small maths. Plain script: build.mjs concatenates the parts in one scope.
const f = (n) => Math.round(n * 100) / 100;
let _uid = 0;
const nid = (p) => p + (++_uid);

/* ---- the howling wolf, drawn with a pen: smooth runs where the skin is tight, corners where the form turns. Nose tip at (546, 0) ---- */
/* nodes: [x, y, 's' smooth | 'c' corner] in drawing order, starting at the top of the nose and going back along the head */
function nodes(o = {}) {
  const fang = o.fang !== false, locks = o.locks !== false, ear = o.ear ?? 1;   // ear: 0 = as traced (blunt), 1 = drawn to a point
  const tipEar = ear ? [[84, 284, 's'], [67 - 3 * ear, 316, 'c'], [80, 346, 's'], [96, 364, 's']] : [[80, 284, 's'], [72, 300, 's'], [75, 336, 's'], [90, 360, 's']];
  // locks of fur: each one runs along the flow of the coat to a point, then cuts back under itself
  const T = [-.66, .75], NO = [-.75, -.66], B = d => [106 + d * T[0], 378 + d * T[1]];          // nape: the line from the notch under the ear, and its outward normal
  const napeLock = (d, out = 5, back = 7, inn = 8) => { const t = B(d), u = B(d - back); return [[t[0] + out * NO[0], t[1] + out * NO[1], 'c'], [u[0] - inn * NO[0], u[1] - inn * NO[1], 'c']]; };
  const ns = o.napeStart ?? 34;   // how far down the nape the first lock sits (the hoop usually cuts the nape before that)
  const nape = locks ? [[106, 378, 'c'], ...napeLock(ns, 4), ...napeLock(ns + 58), ...napeLock(ns + 124), ...napeLock(ns + 198), ...napeLock(ns + 278)]
                     : [[106, 378, 'c'], [84, 398, 's'], [56, 440, 's'], [24, 484, 's'], [-10, 530, 's'], [-60, 590, 's']];
  const chestUp = locks   // from below, upward. Each lock: the cut-back, the tip of the lock above it, then a point on that lock's outer edge
    ? [[504, 652, 'c'], [519, 660, 'c'], [522, 624, 's'], [517, 596, 'c'], [533, 604, 'c'], [536, 567, 's'], [530, 540, 'c'], [546, 548, 'c'], [548, 514, 's'], [542, 485, 'c'], [559, 494, 'c'], [559, 462, 's'], [553, 437, 'c'], [568, 444, 'c'], [567, 421, 's'], [560, 402, 'c'], [574, 408, 'c'], [562, 388, 's'], [547, 362, 's']]
    : [[505, 655, 's'], [518, 598, 's'], [527, 545, 's'], [542, 490, 's'], [555, 450, 's'], [566, 412, 's'], [562, 388, 's'], [547, 362, 's']];
  const mouth = fang ? [[613, 132, 'c'], [596, 112, 'c'], [591, 136, 'c'], [574, 139, 'c']] : [[610, 133, 's'], [590, 137, 's'], [574, 139, 'c']];
  return [
    [546, 0, 's'], [500, 34, 's'], [430, 101, 's'], [400, 119, 's'], [378, 119, 's'], [340, 128, 's'], [312, 136, 's'], [286, 157, 's'], [262, 186, 's'], [219, 217, 's'], [160, 246, 's'], [106, 272, 's'],
    ...tipEar, ...nape,
    [-200, 720, 'c'], [-420, 900, 'c'], [-420, 1300, 'c'], [470, 1300, 'c'],
    ...chestUp,
    [540, 338, 's'], [547, 306, 's'], [568, 274, 's'], [582, 247, 's'], [612, 218, 's'], [638, 191, 's'], [649, 172, 's'], [651, 157, 's'], [647, 140, 's'], [634, 130, 's'],
    ...mouth,
    [574, 120, 's'], [584, 84, 's'], [592, 64, 's'], [585, 50, 's'], [571, 37, 'c'], [566, 20, 's'], [556, 5, 's'],
  ];
}
/* pen path through nodes: smooth nodes get a continuous tangent, corner nodes do not */
function penPath(N, tension = .34) {
  const n = N.length, P = i => N[(i + n) % n], sub = (a, b) => [a[0] - b[0], a[1] - b[1]], len = v => Math.hypot(v[0], v[1]) || 1;
  const tan = i => { const v = sub(P(i + 1), P(i - 1)), l = len(v); return [v[0] / l, v[1] / l]; };
  let d = `M${f(P(0)[0])},${f(P(0)[1])}`;
  for (let i = 0; i < n; i++) { const a = P(i), b = P(i + 1), L = len(sub(b, a));
    const c1 = a[2] === 's' ? [a[0] + tan(i)[0] * L * tension, a[1] + tan(i)[1] * L * tension] : [a[0] + (b[0] - a[0]) / 3, a[1] + (b[1] - a[1]) / 3];
    const c2 = b[2] === 's' ? [b[0] - tan(i + 1)[0] * L * tension, b[1] - tan(i + 1)[1] * L * tension] : [b[0] - (b[0] - a[0]) / 3, b[1] - (b[1] - a[1]) / 3];
    d += (a[2] === 'c' && b[2] === 'c') ? `L${f(b[0])},${f(b[1])}` : `C${f(c1[0])},${f(c1[1])} ${f(c2[0])},${f(c2[1])} ${f(b[0])},${f(b[1])}`; }
  return d + 'Z';
}
/* the wolf placed in the artboard: scale k, nose tip at (nx, ny) */
const NOSE = [546, 0];
const placed = (k, nx, ny, o) => nodes(o).map(([x, y, t]) => [nx + k * (x - NOSE[0]), ny + k * (y - NOSE[1]), t]);
const wolfPath = (k, nx, ny, o) => penPath(placed(k, nx, ny, o));

/* ---- the mark: wolf, hoop and three threads in one metal (silver on dark, steel on light); the crescent carries Klein blue.
   Artboard 400 x 448 with threads (48 / 84 / 48 long), 400 x 400 without. Hoop: centre (200, 192), r 144 ---- */
const GEO = { k: .30, nx: 228, ny: 156, mx: 262, my: 112, mr: 30, ri: .86, di: .42, ma: 33.7, hoop: 5, thread: 3.5, napeStart: 80 };
const TINY = { k: .34, nx: 225.6, ny: 133, mx: 262, my: 112, mr: 33, hoop: 15 };
const TONE = {
  silver: { wolf: [[0, '#FFFFFF'], [.2, '#F3F6F9'], [.44, '#C6CDD7'], [.58, '#97A1AF'], [.66, '#E1E6EC'], [.84, '#B3BBC7'], [1, '#8B95A4']], rim: '#FFFFFF',
            hoop: [[0, '#FFFFFF'], [.2, '#BFC7D2'], [.36, '#F6F8FA'], [.55, '#8C96A5'], [.72, '#E9EDF2'], [1, '#A4ADBA']], bead: ['#F6F8FA', '#9EA7B5'] },
  steel:  { wolf: [[0, '#7B8493'], [.2, '#4A515D'], [.44, '#20242C'], [.58, '#0E1116'], [.66, '#4E5562'], [.84, '#262B34'], [1, '#12151A']], rim: '#AEB6C2',
            hoop: [[0, '#3C434E'], [.2, '#8D96A4'], [.36, '#2A2F38'], [.55, '#737B89'], [.72, '#1F232A'], [1, '#5A616D']], bead: ['#6A7280', '#1B1F26'] },
};
const ACCENT = { klein: ['#7FA8FF', '#1F55F0', '#0A2FA8'], aurora: ['#3CE0BA', '#3BA7FF', '#3F5BFF'], gold: ['#F7E4A8', '#DDB75E', '#9A7626'] };
const stops = a => a.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('');
/* mark(o): size, bare (no threads), tight (crop to the hoop; needs bare), tiny (≤ 48 px: no fur detail, heavy hoop, larger crescent),
   tone 'silver' | 'steel', accent (three stops), flat (one colour for everything), disc (fill inside the hoop), part 1–4 (opening animation), inline */
function mark(o = {}) {
  const g = { ...GEO, ...(o.tiny ? TINY : {}) }, t = TONE[o.tone || 'silver'], ac = o.accent || ACCENT.klein, id = 'lg' + (++_uid), bare = !!o.bare, TL = o.threads || [48, 84, 48], H = bare ? 400 : 364 + TL[1];
  const vb = bare && o.tight ? '44 44 312 312' : `0 0 400 ${H}`, ratio = bare ? 1 : H / 400, flat = o.flat, part = o.part || 4, CX = 200, CY = 192, R = 144;
  const wolfD = wolfPath(g.k, g.nx, g.ny, { fang: !o.tiny, locks: !o.tiny, napeStart: g.napeStart });
  const a = g.ma * Math.PI / 180, cx2 = g.mx + g.di * g.mr * Math.cos(a), cy2 = g.my - g.di * g.mr * Math.sin(a);
  const defs = flat ? '' : `<linearGradient id="${id}w" gradientUnits="userSpaceOnUse" x1="268" y1="112" x2="92" y2="336">${stops(t.wolf)}</linearGradient>
<linearGradient id="${id}h" gradientUnits="userSpaceOnUse" x1="70" y1="62" x2="330" y2="322">${stops(t.hoop)}</linearGradient>
<linearGradient id="${id}t" gradientUnits="userSpaceOnUse" x1="0" y1="330" x2="0" y2="${336 + TL[1]}">${stops([[0, t.hoop[2][1]], [.5, t.hoop[3][1]], [1, t.hoop[4][1]]])}</linearGradient>
<linearGradient id="${id}k" gradientUnits="userSpaceOnUse" x1="${f(g.mx - g.mr)}" y1="${f(g.my - g.mr)}" x2="${f(g.mx + g.mr)}" y2="${f(g.my + g.mr)}">${stops([[0, ac[0]], [.55, ac[1]], [1, ac[2]]])}</linearGradient>`;
  const disc = o.disc ? `<circle cx="${CX}" cy="${CY}" r="${R}" fill="${o.disc}"/>` : '';
  const moon = part < 2 ? '' : `<mask id="${id}c"><rect x="0" y="0" width="400" height="470" fill="#fff"/><circle cx="${f(cx2)}" cy="${f(cy2)}" r="${f(g.ri * g.mr)}" fill="#000"/></mask><circle cx="${g.mx}" cy="${g.my}" r="${g.mr}" fill="${flat || `url(#${id}k)`}" mask="url(#${id}c)"/>`;
  // the wolf: a light copy underneath, the metal on top nudged down-right, so the upper edge catches the light
  const body = part < 3 ? '' : `<clipPath id="${id}p"><circle cx="${CX}" cy="${CY}" r="${R - 2}"/></clipPath><clipPath id="${id}q"><path d="${wolfD}"/></clipPath>
    <g clip-path="url(#${id}p)"${part === 3 ? ' transform="translate(-14 46)"' : ''}>${flat ? `<path d="${wolfD}" fill="${flat}"/>` : `<path d="${wolfD}" fill="${t.rim}"/><g clip-path="url(#${id}q)"><path d="${wolfD}" fill="url(#${id}w)" transform="translate(${o.tiny ? '0 0' : '1.1 1.5'})"/></g>`}</g>`;
  const hoop = `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${flat || (part === 1 ? t.hoop[3][1] : `url(#${id}h)`)}" stroke-width="${g.hoop}"/>`;
  const threads = bare || part < 4 ? '' : [-48, 0, 48].map((dx, i) => { const x = CX + dx, y0 = CY + Math.sqrt(R * R - dx * dx), y1 = y0 + TL[i];
    return `<path d="M${x},${f(y0)}V${f(y1)}" stroke="${flat || `url(#${id}t)`}" stroke-width="${g.thread}"/>` + (flat ? `<rect x="${x - 6}" y="${f(y1 - 6)}" width="12" height="12" transform="rotate(45 ${x} ${f(y1)})" fill="${flat}"/>`
      : `<path d="M${x},${f(y1 - 8.5)}L${x - 8.5},${f(y1)}L${x},${f(y1 + 8.5)}Z" fill="${t.bead[0]}"/><path d="M${x},${f(y1 - 8.5)}L${x + 8.5},${f(y1)}L${x},${f(y1 + 8.5)}Z" fill="${t.bead[1]}"/>`); }).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}"${o.size ? ` width="${o.size}" height="${f(o.size * ratio)}"` : ''} role="img" aria-label="DreamCatcher"${o.inline === false ? '' : ' style="display:block;overflow:visible;flex:none"'}><defs>${defs}</defs><g${bare ? ' transform="translate(0 8)"' : ''}>${disc}${moon}${body}${hoop}${threads}</g></svg>`;
}
/* the desktop icon: a white tile, the whole mark (threads included) in steel. o.canvas: macOS margins (tile = 824 / 1024 of the canvas) */
function appIcon(size = 1024, o = {}) {
  const id = 'ic' + (++_uid), tile = o.canvas ? size * 824 / 1024 : size, off = (size - tile) / 2, r = tile * .2237, small = size <= 64;
  const mw = tile * (small ? .78 : .6), inner = small ? mark({ size: f(mw), bare: true, tight: true, tiny: true, tone: 'steel', accent: o.accent, inline: false }) : mark({ size: f(mw), tone: 'steel', accent: o.accent, inline: false });
  const mh = small ? mw : mw * 448 / 400, px = off + (tile - mw) / 2, py = off + (tile - mh) / 2 + (small ? 0 : tile * .012);
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"${o.inline === false ? '' : ' style="display:block;flex:none"'}><defs>
<linearGradient id="${id}a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#F4F6F9"/><stop offset="1" stop-color="#DCE1E8"/></linearGradient>
<linearGradient id="${id}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient></defs>
<rect x="${f(off)}" y="${f(off)}" width="${f(tile)}" height="${f(tile)}" rx="${f(r)}" fill="url(#${id}a)"/><rect x="${f(off)}" y="${f(off)}" width="${f(tile)}" height="${f(tile * .5)}" rx="${f(r)}" fill="url(#${id}b)"/>
<rect x="${f(off + tile * .003)}" y="${f(off + tile * .003)}" width="${f(tile * .994)}" height="${f(tile * .994)}" rx="${f(r * .99)}" fill="none" stroke="rgba(12,16,24,.14)" stroke-width="${f(tile * .006)}"/>
<g transform="translate(${f(px)} ${f(py)})">${inner}</g></svg>`;
}


/* ---- new and full moons after Meeus, "Astronomical Algorithms", ch. 49 (good to a few minutes) ---- */
const RAD = Math.PI / 180;
function lunation(k) {   // integer k = new moon, k + .5 = full moon; k = 0 is the new moon of 2000-01-06

const svgOpen = (cls = '') => `<svg class="${cls}" width="${DG.W}" height="${DG.H}" viewBox="0 0 ${DG.W} ${DG.H}" style="left:0;top:0;overflow:visible">`;
const conicGold = (g, from = 315) => `conic-gradient(from ${from}deg, ${g[0]}, ${g[2]} 11%, ${g[4]} 24%, ${g[1]} 37%, ${g[0]} 50%, ${g[2]} 61%, ${g[4]} 74%, ${g[1]} 88%, ${g[0]})`;
const sunburst = (s, dark) => `repeating-conic-gradient(${dark ? 'rgba(255,255,255,.04)' : 'rgba(60,70,90,.035)'} 0deg .35deg, rgba(255,255,255,0) .35deg .9deg), radial-gradient(circle, rgba(0,0,0,0) 40%, ${dark ? 'rgba(0,0,0,.36)' : 'rgba(110,120,140,.2)'} 100%), conic-gradient(from 18deg, ${s[0]} 0%, ${s[2]} 8%, ${s[1]} 17%, ${s[2]} 25%, ${s[0]} 33%, ${s[2]} 44%, ${s[1]} 54%, ${s[2]} 66%, ${s[0]} 75%, ${s[2]} 87%, ${s[0]} 100%)`;
/* a moon as a mark: `lit` 0…1 of the disc is bright, tilted like the real one */
const moonG = (x, y, R, lit, fill, body, edge, rot = -22) => { const k = Math.abs(1 - 2 * lit) * R, d = lit >= .995 ? `M${f(x - R)},${f(y)}a${R},${R} 0 1,0 ${2 * R},0a${R},${R} 0 1,0 ${-2 * R},0` : `M${f(x)},${f(y - R)}A${R},${R} 0 0,1 ${f(x)},${f(y + R)}A${f(k)},${R} 0 0,${lit > .5 ? 1 : 0} ${f(x)},${f(y - R)}Z`;
  return `<g transform="rotate(${rot} ${f(x)} ${f(y)})"><circle cx="${f(x)}" cy="${f(y)}" r="${R}" fill="${body}" stroke="${edge}" stroke-width=".9"/><path d="${d}" fill="${fill}"/></g>`; };
const glint = (x, y, s, col, op = 1) => `<path d="M${f(x)},${f(y - s)}Q${f(x)},${f(y)} ${f(x + s)},${f(y)}Q${f(x)},${f(y)} ${f(x)},${f(y + s)}Q${f(x)},${f(y)} ${f(x - s)},${f(y)}Q${f(x)},${f(y)} ${f(x)},${f(y - s)}Z" fill="${col}" opacity="${op}"/>`;
/* a cut stone seen from above: four facets around the centre. m = [light, mid, mid-dark, dark] */
const gem = (x, y, w, h, m, rot = 0) => `<g${rot ? ` transform="rotate(${f(rot)} ${f(x)} ${f(y)})"` : ''}><path d="M${f(x)},${f(y - h)}L${f(x - w)},${f(y)}L${f(x)},${f(y)}Z" fill="${m[0]}"/><path d="M${f(x)},${f(y - h)}L${f(x + w)},${f(y)}L${f(x)},${f(y)}Z" fill="${m[1]}"/><path d="M${f(x)},${f(y + h)}L${f(x - w)},${f(y)}L${f(x)},${f(y)}Z" fill="${m[2]}"/><path d="M${f(x)},${f(y + h)}L${f(x + w)},${f(y)}L${f(x)},${f(y)}Z" fill="${m[3]}"/></g>`;
const litNow = (t) => (1 - Math.cos(phaseAngle(t) * DEG)) / 2;

/* dial(T, M, o) → HTML for the inside of .dialbox.
   M: { roles, sectors, focusMin, pipeN, now, L: { focus, total, sent, n(count), blue, silver, full, fresh, soon, tonight } }
   o: { mini (no sector names, no legend), sweepFrom (degrees the hand starts from; the page animates --sw), dur (seconds of the opening turn) }

function dial(T, M, o = {}) {
  const c = T.c, id = nid('cy'), dark = T.name === 'dark', big = o.mini ? 1.6 : 1, { cx, cy, Rd, Ri, Ro } = DG, g = c.gold, sv = c.silver, bl = c.blue, L = M.L, fm = M.focusMin;
  const pts = dialLayout(M.roles, M.sectors, fm).map((p) => ({ ...p, xy: polar(cx, cy, p.rad, p.a) })), focusN = M.roles.filter((r) => r.pr >= fm).length;
  // when the hand passes each moon on its opening turn (seconds); 0 when there is no opening turn
  const dur = o.dur || 0, target = o.target ?? 0, tOf = (a) => { if (!dur) return 0; const a1 = a <= target ? a : a - 360, p = Math.max(0, Math.min(1, (a1 - (target - 360)) / 360)); return f((1 - Math.cbrt(1 - p)) * dur + .05); };
  const defs = lgr(id + 'au', [g[0], g[1], g[2], g[3]]) + lgr(id + 'ag', [sv[0], sv[1], sv[2], sv[3]]) + lgr(id + 'n', c.num, 0, 0, 0, 1) + lgr(id + 'mf', c.litF) + lgr(id + 'mo', c.litO)
    + `<radialGradient id="${id}g2"><stop offset="0" stop-color="${c.halo}"/><stop offset="1" stop-color="${c.halo}" stop-opacity="0"/></radialGradient><clipPath id="${id}c"><circle cx="${cx}" cy="${cy}" r="${Rd}"/></clipPath>
      <filter id="${id}sh" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="16"/></filter><filter id="${id}b4"><feGaussianBlur stdDeviation="4"/></filter>`;
  const facets = dark ? [sv[0], sv[2], sv[1], sv[3]] : [sv[1], sv[3], sv[2], sv[4]], gfac = [g[0], g[2], g[1], g[3]];

  /* ---- behind the bezel: the ring of light. A deep-blue corona, fine rays, and a brighter arc that follows the hand ---- */
  const R0 = Ro + 1.5, R = rnd(31), k0 = R0 / (R0 + 104);
  let cor = `<radialGradient id="${id}co"><stop offset="${f(k0 - .025)}" stop-color="${c.cor[0]}" stop-opacity="0"/><stop offset="${f(k0)}" stop-color="${c.cor[0]}" stop-opacity="${c.corOp[0]}"/><stop offset="${f(k0 + .09)}" stop-color="${c.cor[1]}" stop-opacity="${c.corOp[1]}"/><stop offset="${f(k0 + .32)}" stop-color="${c.cor[2]}" stop-opacity="${c.corOp[2]}"/><stop offset="1" stop-color="${c.cor[2]}" stop-opacity="0"/></radialGradient><circle class="glow" cx="${cx}" cy="${cy}" r="${R0 + 104}" fill="url(#${id}co)"/><g class="rays">`;
  for (let i = 0; i < 180; i++) { const a = i * 2 + (R() - .5) * 1.5, eq = Math.pow(Math.abs(Math.sin(a * DEG)), 1.5), len = 5 + 22 * eq * R() + 9 * R(), op = (dark ? .26 : .3) + .5 * R();
    for (let q = 0; q < 3; q++) { const p0 = polar(cx, cy, R0 + 1.5 + len * q / 3, a), p1 = polar(cx, cy, R0 + 1.5 + len * (q + 1) / 3, a); cor += `<path d="M${P2(p0)}L${P2(p1)}" stroke="${c.ray[q]}" stroke-width="${f(1.5 - q * .35)}" opacity="${f(op * (1 - q * .3))}"/>`; } }
  cor += `</g><circle cx="${cx}" cy="${cy}" r="${R0 + .8}" fill="none" stroke="${c.ray[dark ? 0 : 1]}" stroke-width="1.4" opacity=".85"/><g class="rot">`;
  for (let k = 0; k < 120; k++) { const a1 = -k, u = k / 120, p0 = polar(cx, cy, R0 + 1.5, a1 - 1.3), p1 = polar(cx, cy, R0 + 1.5, a1); cor += `<path d="M${P2(p0)}A${R0 + 1.5},${R0 + 1.5} 0 0,1 ${P2(p1)}" fill="none" stroke="${dark ? mix('#FFFFFF', c.ray[1], u) : mix(c.ray[0], c.ray[2], u)}" stroke-width="${f(5.5 * (1 - u) + 1)}" opacity="${f(.95 * Math.pow(1 - u, 1.3))}"/>`; }
  cor += '</g>';
  const back = svgOpen('back') + `<defs>${defs}</defs>` + cor + `<circle cx="${cx}" cy="${cy + 20}" r="${Ro - 8}" fill="${c.shadow}" filter="url(#${id}sh)"/></svg>`;
  const veil = `<div class="veil" style="left:150px;top:-40px;width:520px;height:150px;border-radius:50%;background:radial-gradient(closest-side, ${c.veil[0]}, rgba(0,0,0,0));filter:blur(24px);opacity:.7"></div><div class="veil v2" style="left:300px;top:-56px;width:440px;height:170px;border-radius:50%;background:radial-gradient(closest-side, ${c.veil[1]}, rgba(0,0,0,0));filter:blur(26px);opacity:.7"></div>`;

  /* ---- the bezel: silver flutes with a sheen, a gold line inside and outside ---- */
  const flutes = ringDiv(Ri, Ro - 2, `repeating-conic-gradient(from 0deg, ${sv[0]} 0deg, ${sv[2]} .8deg, ${sv[4]} 1.45deg, ${sv[3]} 2.1deg, ${sv[0]} 3deg)`) + ringDiv(Ri, Ro - 2, `conic-gradient(from 315deg, rgba(255,255,255,.3), rgba(0,0,0,${dark ? .55 : .3}) 24%, rgba(255,255,255,.14) 49%, rgba(0,0,0,${dark ? .6 : .34}) 74%, rgba(255,255,255,.3))`, 'animation:sheen 14s linear infinite');
  const rings = flutes + ringDiv(Rd, Ri + .6, conicGold(g)) + ringDiv(Ro - 2.6, Ro + 1.2, conicGold(g, 135));
  const face = discDiv(Rd, sunburst(c.sun, dark), `box-shadow:inset 0 0 0 1.5px ${c.faceEdge}`);

  /* ---- on the dial ---- */
  let s = svgOpen('front') + `<defs>${defs}</defs>`;
  // spokes between the eight sectors, and the fit rings 60 / 75 / 90 as soft blue halos
  for (let i = 0; i < 8; i++) { const p0 = polar(cx, cy, 47, i * 45), p1 = polar(cx, cy, Rd - 3, i * 45); s += `<path d="M${P2(p0)}L${P2(p1)}" stroke="${c.haloC}" stroke-width=".8" opacity=".2"/>`; }
  const ringCol = bl[dark ? 1 : 2];
  [60, 75, 90].forEach((v) => { const r = rOf(v); s += `<circle cx="${cx}" cy="${cy}" r="${f(r)}" fill="none" stroke="${ringCol}" stroke-width="5" opacity="${dark ? .38 : .24}" filter="url(#${id}b4)"/><circle cx="${cx}" cy="${cy}" r="${f(r)}" fill="none" stroke="${ringCol}" stroke-width="1" opacity="${dark ? .8 : .65}"/><text x="${cx}" y="${f(cy - r + 4.6 * big)}" text-anchor="middle" font-family="DM Mono" font-size="${13 * big}" fill="${c.ink2}" stroke="${c.sun[1]}" stroke-width="5" paint-order="stroke">${v}</text>`; });
  // the hand: a faint wedge of light behind it, a short blue trace along the rim, a silver line
  let hand = '';
  for (let k = 0; k < 80; k++) { const a1 = -k * .5, p0 = polar(cx, cy, Rd, a1 - .62), p1 = polar(cx, cy, Rd, a1); hand += `<path d="M${cx},${cy}L${P2(p0)}A${Rd},${Rd} 0 0,1 ${P2(p1)}Z" fill="${bl[2]}" opacity="${f((dark ? .12 : .08) * Math.pow(1 - k / 80, 1.7))}"/>`; }
  hand = `<g clip-path="url(#${id}c)">${hand}</g>`;
  for (let k = 0; k < 80; k++) { const a1 = -k, u = k / 80, p0 = polar(cx, cy, Rd - 7, a1 - 1.25), p1 = polar(cx, cy, Rd - 7, a1); hand += `<path d="M${P2(p0)}A${Rd - 7},${Rd - 7} 0 0,1 ${P2(p1)}" fill="none" stroke="${mix(c.trace[0], c.trace[1], u)}" stroke-width="${f(6 * (1 - u * .6))}" opacity="${f((dark ? .42 : .3) * Math.pow(1 - u, 1.5))}"/>`; }
  const tip = polar(cx, cy, Rd - 2, 0);
  hand += `<path d="M${cx},${cy}L${P2(tip)}" stroke="url(#${id}ag)" stroke-width="1.8"/><path d="M${cx},${cy}L${P2(tip)}" stroke="${sv[0]}" stroke-width=".6" opacity=".8"/>`;
  s += `<g class="rot">${hand}</g>`;
  // the moons, least urgent first so the ones to look at sit on top
  pts.slice().sort((p, q) => p.r.pr - q.r.pr).forEach((p) => { const [x, y] = p.xy, r = p.r, z = p.dot + 1, fo = r.pr >= fm, X = f(x), Y = f(y);
    if (r.st) { s += `<g class="m st" data-id="${escAttr(r.id)}" style="--t:${tOf(p.a)}"><g class="mi"><circle cx="${X}" cy="${Y}" r="${f(Math.max(3.4, z * .8))}" fill="${c.moonBody}" fill-opacity=".5" stroke="${c.moonEdge}" stroke-width="1" stroke-dasharray="2.2 2"/></g><circle cx="${X}" cy="${Y}" r="10" fill="transparent"/></g>`; return; }
    let m = r.band === 'A' ? `<circle cx="${X}" cy="${Y}" r="${f(z + 11)}" fill="url(#${id}g2)"/>` : '';
    m += `<g${r.band === 'D' ? ' opacity=".55"' : !fo && r.band === 'C' ? ' opacity=".82"' : ''}>${moonG(x, y, f(z), r.lit, `url(#${id}${fo ? 'mf' : 'mo'})`, c.moonBody, fo ? c.moonEdgeF : c.moonEdge)}</g>`;
    m += r.soon ? `<circle class="em" cx="${X}" cy="${Y}" r="${f(z + 5)}" fill="none" stroke="${c.ember}" stroke-width="1.7"/>` : r.fresh ? `<circle cx="${X}" cy="${Y}" r="${f(z + 4.6)}" fill="none" stroke="${c.fresh}" stroke-width="1.1" opacity=".9"/><circle class="pg" cx="${X}" cy="${Y}" r="${f(z + 9)}" fill="none" stroke="${c.fresh}" stroke-width=".9" opacity=".34"/>` : '';
    s += `<g class="m${fo ? ' fo' : ''}" data-id="${escAttr(r.id)}" style="--t:${tOf(p.a)}"><g class="mi">${m}</g><circle cx="${X}" cy="${Y}" r="${f(Math.max(z + 5, 11))}" fill="transparent"/></g>`; });
  // rank numbers next to the ones to look at first, placed where they collide with nothing
  { const placed = [60, 75, 90].map((v) => [cx - 12, cy - rOf(v) - 8, 24, 16]);
    pts.filter((p) => p.r.pr >= fm).sort((a, b) => a.r.rank - b.r.rank).slice(0, 24).forEach((p) => { const [x, y] = p.xy, gg = p.z + 4, w = 17 * big, h = 12 * big, out = x >= cx ? 1 : -1, cand = [[x + out * gg, y, out > 0 ? 'start' : 'end'], [x - out * gg, y, out > 0 ? 'end' : 'start'], [x, y + gg + 8, 'middle'], [x, y - gg - 6, 'middle']];
      const box = ([lx, ly, an]) => [an === 'start' ? lx : an === 'end' ? lx - w : lx - w / 2, ly - h / 2, w, h];
      const bad = (bx) => pts.some((q) => q !== p && bx[0] < q.xy[0] + q.z + 2 && bx[0] + bx[2] > q.xy[0] - q.z - 2 && bx[1] < q.xy[1] + q.z + 2 && bx[1] + bx[3] > q.xy[1] - q.z - 2) || (Math.hypot(Math.max(bx[0], Math.min(cx, bx[0] + bx[2])) - cx, Math.max(bx[1], Math.min(cy, bx[1] + bx[3])) - cy) < 47) || Math.hypot(bx[0] + bx[2] / 2 - cx, bx[1] + bx[3] / 2 - cy) > Rd - 12 || placed.some((q) => bx[0] < q[0] + q[2] + 2 && bx[0] + bx[2] > q[0] - 2 && bx[1] < q[1] + q[3] + 2 && bx[1] + bx[3] > q[1] - 2);
      const pick = cand.find((q) => !bad(box(q))); if (!pick) return; placed.push(box(pick));
      s += `<text class="lb" style="--t:${tOf(p.a)}" x="${f(pick[0])}" y="${f(pick[1] + 4.6 * big)}" text-anchor="${pick[2]}" font-family="DM Mono" font-weight="500" font-size="${f(13 * big)}" fill="${c.lab}" stroke="${c.sun[1]}" stroke-width="3" paint-order="stroke">${pad2(p.r.rank)}</text>`; }); }
  // the hub: the mark inside a gold ring
  s += `<circle cx="${cx}" cy="${cy}" r="45.5" fill="none" stroke="${g[2]}" stroke-width=".8" opacity=".6"/><circle cx="${cx}" cy="${cy}" r="41" fill="${c.hub}"/><circle cx="${cx}" cy="${cy}" r="41" fill="none" stroke="url(#${id}au)" stroke-width="2.5"/><g transform="translate(${cx - 31} ${cy - 31})">${mark({ size: 62, bare: true, tight: true, tone: c.hub === '#FFFFFF' ? 'steel' : 'silver', accent: T.moon, inline: false }).replace('<svg ', '<svg overflow="visible" ')}</g>`;
  // eight cut gold studs on the bezel, at the sector boundaries
  for (let i = 0; i < 8; i++) { const [x, y] = polar(cx, cy, (Ri + Ro) / 2 - 1, i * 45); s += gem(x, y, 4.6, 7.5, gfac, i * 45); }
  // tonight's moon rides the inner gold line; it stays upright while the hand turns
  { const rm = Ri - 1, Rm = 13.5, mx = cx, my = cy - rm, lit = litNow(M.now), waning = phaseAngle(M.now) > 180;
    s += `<g class="rot"><circle cx="${mx}" cy="${f(my)}" r="${Rm * 2}" fill="url(#${id}g2)"/><g class="unrot" style="transform-origin:${mx}px ${f(my)}px"><g${waning ? ` transform="translate(${2 * mx} 0) scale(-1 1)"` : ''}>${moonG(mx, my, Rm, lit, c.win[1] || `url(#${id}ag)`, c.win[0], g[dark ? 1 : 2])}</g>${glint(mx + Rm * .9, my - Rm * .85, 8, '#FFFFFF', .9)}</g></g>`; }
  // sector names outside the bezel
  if (!o.mini) s += M.sectors.map(([key, name], i) => { const a = i * 45 + 22.5, [x, y] = polar(cx, cy, Ro + 50, a), an = a < 180 ? 'start' : 'end', n = M.roles.filter((r) => r.s === key && !r.st).length;
    return `<g class="sn" data-sector="${key}"><text x="${f(x)}" y="${f(y)}" text-anchor="${an}" font-family="Outfit, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-weight="500" font-size="14" fill="${c.ink}">${name}</text><text x="${f(x)}" y="${f(y + 18)}" text-anchor="${an}" font-family="'DM Mono', 'PingFang SC', 'Noto Sans CJK SC', monospace" font-size="13" fill="${c.muted}">${L.n(n)}</text></g>`; }).join('');
  // the three threads of the dreamcatcher, each carrying one number
  s += [[o.mini ? -118 : -74, 60, focusN, L.focus, 'focus'], [0, 112, M.total ?? M.roles.length, L.total, 'all'], [o.mini ? 118 : 74, 60, M.pipeN, L.sent, 'pipe']].map(([dx, len, num, cap, k]) => { const x = cx + dx, y0 = cy + Math.sqrt((Ro + 1) ** 2 - dx * dx), y1 = y0 + len;
    return `<g class="th" data-go="${k}"><path d="M${x},${f(y0)}V${f(y1)}" stroke="${sv[3]}" stroke-width="2.6"/><path d="M${x - .5},${f(y0)}V${f(y1)}" stroke="${sv[1]}" stroke-width="1"/>${gem(x, y1, 8.5, 9.5, facets)}
      <text x="${x}" y="${f(y1 + (o.mini ? 58 : 45))}" text-anchor="middle" font-family="Outfit" font-weight="300" font-size="${o.mini ? 42 : 30}" letter-spacing="-.5" fill="url(#${id}n)">${num}</text><text x="${x}" y="${f(y1 + (o.mini ? 86 : 65))}" text-anchor="middle" font-family="Outfit, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="${o.mini ? 22 : 13}" fill="${c.muted}">${cap}</text><rect x="${x - 44}" y="${f(y0)}" width="88" height="${f(len + 74)}" fill="transparent"/></g>`; }).join('');
  if (!o.mini) { const mg = (lit, fill, edge) => moonG(8, 0, 7.5, lit, fill, c.moonBody, edge), row = (x, y, [gl, tx]) => `<g transform="translate(${x} ${y})">${gl}<text x="24" y="4.6" font-family="Outfit, 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="13" fill="${c.ink2}">${tx}</text></g>`;
    const left = [[mg(.74, `url(#${id}mf)`, c.moonEdgeF), L.blue(focusN)], [mg(.34, `url(#${id}mo)`, c.moonEdge), L.silver((M.total ?? M.roles.length) - focusN)], [mg(1, `url(#${id}mf)`, c.moonEdgeF), L.full]];
    const nSt = M.roles.filter((r) => r.st).length; if (nSt) left.push([`<circle cx="8" r="6" fill="${c.moonBody}" fill-opacity=".5" stroke="${c.moonEdge}" stroke-width="1" stroke-dasharray="2.2 2"/>`, L.hollow(nSt)]);
    const right = [[`<circle cx="8" r="5" fill="none" stroke="${c.ink}" stroke-width="1.1"/><circle cx="8" r="9" fill="none" stroke="${c.ink}" stroke-width=".9" opacity=".4"/>`, L.fresh(M.roles.filter((r) => r.fresh && !r.st).length)], [`<circle cx="8" r="7" fill="none" stroke="${c.ember}" stroke-width="1.7"/>`, L.soon(M.roles.filter((r) => r.soon && !r.st).length)], [moonG(8, 0, 7.5, litNow(M.now), c.win[1] || `url(#${id}ag)`, c.win[0], g[dark ? 1 : 2]), L.tonight]];
    s += `<g class="lg">` + left.map((e, i) => row(40, (left.length > 3 ? 724 : 738) + i * 22, e)).join('') + right.map((e, i) => row(604, 738 + i * 22, e)).join('') + '</g>'; }
  return veil + back + rings + face + s + '</svg>';
}

/* ===== i18n.js ===== */
// i18n.js — every word the page shows, in Chinese and English. The scan data carries codes, not sentences, so both languages
// read the same facts. Entries are strings or functions of their parameters. Job titles and company names are never translated.
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], WD = { zh: ['周日', '周一', '周二', '周三', '周四', '周五', '周六'], en: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'] };
const STR = {
  zh: {
    title: 'DreamCatcher · 2027 求职雷达', skip: '跳到正文',
    nav: { today: '今日', roles: '岗位', pipe: '管道', engine: '引擎' }, search: '搜公司、岗位，或输入命令', scanned: (hm) => `${hm} 扫描完成`, scanLate: (h) => `数据停在 ${h} 小时前`, dark: '深色', light: '浅色',
    date: (d) => `${d.getMonth() + 1} 月 ${d.getDate()} 日，${WD.zh[d.getDay()]}`, md: (d) => `${d.getMonth() + 1} 月 ${d.getDate()} 日`, mdy: (d) => `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`,
    phases: ['新月', '蛾眉月', '上弦月', '盈凸月', '满月', '亏凸月', '下弦月', '残月'],

/* ---------- routing: #/screen or #/screen/<role id> ---------- */

function onKey(e) {
  const k = e.key, typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || '')) || e.target.isContentEditable;
  if ((e.metaKey || e.ctrlKey) && k.toLowerCase() === 'k') { e.preventDefault(); S.pal ? closePal() : openPal(); return; }
  if (S.pal) { const n = S.pal.items.filter((x) => !x.cap).length; if (k === 'Escape') { e.preventDefault(); closePal(); } else if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); S.pal.on = (S.pal.on + (k === 'ArrowDown' ? 1 : -1) + n) % Math.max(1, n); S.pal.draw(); } else if (k === 'Enter') { e.preventDefault(); runPal(S.pal.on); } return; }
  if (k === 'Escape') { if (S.open) { e.preventDefault(); closeRole(); } else if (typing) e.target.blur(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  const lk = k.toLowerCase();
  if (lk === 'j' || k === 'ArrowDown') { e.preventDefault(); moveSel(1); } else if (lk === 'k' || k === 'ArrowUp') { e.preventDefault(); moveSel(-1); }
  else if (k === 'Enter' && S.sel && !e.target.closest('a,button')) { e.preventDefault(); S.open ? window.open(roleById(S.sel).url, '_blank', 'noopener') : openRole(S.sel); }
  else if (lk === 'a' && (S.open || S.sel)) { e.preventDefault(); apply(S.open || S.sel); } else if (lk === 'x' && (S.open || S.sel)) { e.preventDefault(); hide(S.open || S.sel, !S.hidden.has(S.open || S.sel)); }
  else if (k === '/') { e.preventDefault(); openPal(); } else if (/^[1-4]$/.test(k)) go(ROUTES[+k - 1]); else if (lk === 't') act('theme', { dataset: { v: S.theme === 'dark' ? 'light' : 'dark' }, closest: () => null }, null);
}

/* ---------- events ---------- */
function wire() {
  document.addEventListener('click', (e) => {
    const a = e.target.closest('[data-act]'); if (a) { act(a.dataset.act, a, e); return; }
    const pl = e.target.closest('#pall li[data-i]'); if (pl) { runPal(+pl.dataset.i); return; }
    const m = e.target.closest('.dialbox .m'); if (m) { openRole(m.dataset.id); return; }
    const th = e.target.closest('.dialbox .th'); if (th) { const k = th.dataset.go; if (k === 'focus') { const el = $('#focus'); if (el) el.scrollIntoView({ block: 'start' }); } else go(k === 'pipe' ? 'pipe' : 'roles'); return; }
    const sn = e.target.closest('.dialbox .sn'); if (sn) { setRf({ sector: sn.dataset.sector, region: '', grp: '', cos: [] }); go('roles'); return; }
    const row = e.target.closest('.row[data-id]'); if (row && !e.target.closest('a,button')) openRole(row.dataset.id);
  });
  document.addEventListener('input', (e) => { const k = e.target.dataset.inp; if (k === 'rq') { S.rf.q = e.target.value; drawRoles(true); } else if (k === 'fq') { S.fq = e.target.value; $('#flist').innerHTML = findList(); } });
  document.addEventListener('change', (e) => { const k = e.target.dataset.chg; if (k === 'rsector') { setRf({ sector: e.target.value }); drawRoles(); } else if (k === 'rsort') { setRf({ sort: e.target.value }); drawRoles(); } });
  document.addEventListener('submit', (e) => { const fm = e.target.closest('[data-form=padd]'); if (!fm) return; e.preventDefault(); const d = Object.fromEntries(new FormData(fm)), src = S.data.sources.find((s) => s.name === d.co) || S.data.roles.find((r) => r.co === d.co) || {}; if (!d.co.trim() || !d.t.trim()) return; S.pipe['manual:' + Date.now()] = { s: d.s, at: d.at || today(), co: d.co.trim(), key: src.key || d.co.trim().toLowerCase(), t: d.t.trim(), sec: d.sec, manual: true }; savePipe(); render(); toast(tr().tApplied(d.co.trim())); });
  document.addEventListener('keydown', onKey);
  // the dial: a card follows the pointer over a moon, and hovering a row lights its moon
  const tipFor = (m) => { const tip = $('.tip'), w = $('.dialwrap'); if (!tip || !w) return; if (!m) { tip.classList.remove('on'); return; } const r = roleById(m.dataset.id); if (!r) return; const c = m.querySelector('circle:last-child'), k = +w.dataset.k || 1, ox = S.mini ? 96 : 0, x = (+c.getAttribute('cx') - ox) * k, y = +c.getAttribute('cy') * k;
    tip.innerHTML = `<b>${esc(r.t)}</b><span>${esc(r.co)} · ${esc(place(r))}</span><i><span>${pad2(r.rank)}</span><span>${tr().fit} ${r.fit}</span><span>${r.lo}–${r.hi}%</span><span>${heatName(r.heat)}</span></i>`;
    const tw = Math.min(300, Math.max(220, tip.offsetWidth)); tip.style.left = Math.max(0, Math.min(w.clientWidth - tw, x - tw / 2)) + 'px'; tip.style.top = (y + 18 * k + 8) + 'px'; tip.classList.add('on'); };
  document.addEventListener('mouseover', (e) => { const m = e.target.closest && e.target.closest('.dialbox .m'); if (m) { tipFor(m); return; } const row = e.target.closest && e.target.closest('.row[data-id]'); if (row) hot(row.dataset.id); });
  document.addEventListener('mouseout', (e) => { const m = e.target.closest && e.target.closest('.dialbox .m'); if (m && !(e.relatedTarget && m.contains(e.relatedTarget))) tipFor(null); const row = e.target.closest && e.target.closest('.row[data-id]'); if (row && !(e.relatedTarget && row.contains(e.relatedTarget))) hot(null); });
  addEventListener('hashchange', onHash);
  let rz = 0; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { const mini = innerWidth < 640; if (mini !== S.mini) { S.mini = mini; render(); } else fitDial(); }, 80); });
  addEventListener('pagehide', () => LS.set('lastVisit', new Date().toISOString()));
}

/* ---------- data ---------- */
async function fetchData(first) {
  try { const r = await fetch(DATA_URL + (DATA_URL.includes('?') ? '&' : '?') + 't=' + Math.floor(Date.now() / 6e4), { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); const j = await r.json(); if (!j || j.version !== 6 || !Array.isArray(j.roles)) throw new Error('not a v6 radar file'); return j; }
  catch (e) { const el = $('#dc-data'); if (first && el && el.textContent.trim().length > 2) return JSON.parse(el.textContent); throw e; }
}
async function start() {
  applyTheme(); wire();
  const main = $('#main'); main.innerHTML = `<div class="wrap"><div class="empty" style="padding:120px 0">${tr().loading}</div></div>`;
  try { S.data = await fetchData(true); } catch (e) { main.innerHTML = `<div class="wrap"><div class="empty" style="padding:120px 0"><b>${tr().loadFail[0]}</b>${tr().loadFail[1]}<div style="margin-top:18px"><button class="btn btn--secondary btn--sm" onclick="location.reload()">${tr().retry}</button></div></div></div>`; return; }
  const h = parseHash(); S.route = h.r; migrate(); S.open = h.open && roleById(h.open) ? h.open : null; render();
  // keep the hand moving with the clock, and pick up a new scan when one lands
  setInterval(() => { const box = $('.dialbox'); if (box && S.played) box.style.setProperty('--sw', handAngle() + 'deg'); }, 30000);
  const refresh = async () => { if (document.hidden) return; try { const j = await fetchData(false); if (j.generatedAt !== S.data.generatedAt) { S.data = j; render(); toast(tr().tData); } } catch (e) { /* offline: keep what we have */ } };
  setInterval(refresh, 5 * 6e4); document.addEventListener('visibilitychange', refresh);
}
start();

})();
</script>
