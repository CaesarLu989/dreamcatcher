name: DreamCatcher scan

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dreamcatcher
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Scan career sites
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scraper/index.mjs

      - name: Commit updated data
        run: |
          git config user.name "dreamcatcher-bot"
          git config user.email "dreamcatcher-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "dreamcatcher: $(date -u +'%Y-%m-%d %H:%M UTC') scan"
            git push
          fi
